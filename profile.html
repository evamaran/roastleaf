<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Profile | Roast & Leaf</title>
	<meta name="description" content="Discover artisan coffee and tea blends with detailed origins and tasting notes.">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap"
		rel="stylesheet">
	<script src="https://kit.fontawesome.com/a87332500a.js" crossorigin="anonymous"></script>

	<link rel="stylesheet" href="css/styles.css">
	<link rel="icon" href="images/logo.png" type="image/png">
</head>

<body>

	<header id="header"></header>

	<main class="profile-container">
		<h1>My profile</h1>

		<form id="profileForm">
			<label for="firstName">First name</label>
			<input type="text" id="firstName">

			<label for="lastName">Last name</label>
			<input type="text" id="lastName">

			<label for="email">Email</label>
			<input type="email" id="email" readonly>

			<label for="address">Address</label>
			<input type="text" id="address">

			<div class="postal-city">
				<div>
					<label for="postalCode">Postal code</label>
					<input type="text" id="postalCode">
				</div>
				<div>
					<label for="city">City</label>
					<input type="text" id="city">
				</div>
			</div>

			<div class="phone-group">
				<div>
					<label for="countryCode">Country code</label>
					<select id="countryCode">
						<option value="+47">NO (+47)</option>
						<option value="+46">SE (+46)</option>
						<option value="+45">DK (+45)</option>
						<option value="+358">FI (+358)</option>
					</select>
				</div>
				<div>
					<label for="phone">Phone number</label>
					<input type="tel" id="phone">
				</div>
			</div>
		</form>

		<div class="profile-buttons">
			<button id="saveProfile" class="btn btn--auth" type="submit" form="profileForm">Save Changes</button>

			<button id="logoutBtn" class="btn btn--logout" type="button">Log Out</button>
		</div>

		<button class="btn btn--shop" onclick="window.location.href='categories.html'">Shop Now</button>

		<p id="message" class="profile-message"></p>

	</main>

	<div class="easter-egg">
		<span class="flame">🔥</span>
		<span class="egg-text">Hell doesn't scare me anymore</span>
	</div>

	<footer id="footer"></footer>

	<script type="module" src="js/utils/main.js"></script>
	<script type="module" src="js/utils/cartUtils.js"></script>
	<script type="module" src="js/pages/profile.js"></script>

</body>

</html>
