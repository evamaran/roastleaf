<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Register | Roast & Leaf</title>
	<meta name="description" content="Discover artisan coffee and tea blends with detailed origins and tasting notes.">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap"
		rel="stylesheet">
	<script src="https://kit.fontawesome.com/a87332500a.js" crossorigin="anonymous"></script>

	<link rel="stylesheet" href="css/styles.css">
	<link rel="icon" href="images/logo.png" type="image/png">
</head>

<body>

	<header id="header"></header>

	<main class="auth-container">
		<h1>Register</h1>

		<p class="join-text">Join the Roast & Leaf customer club</p>

		<p>Already a member? <a href="login.html">Log in here.</a></p>

		<form id="registerForm">
			<label for="firstName">First name</label>
			<input type="text" id="firstName" name="firstName" required>

			<label for="lastName">Last name</label>
			<input type="text" id="lastName" name="lastName" required>

			<label for="address">Address</label>
			<input type="text" id="address" name="address" required>

			<div class="postal-city">
				<input type="text" id="postalCode" name="postalCode" placeholder="Postal code" required>
				<input type="text" id="city" name="city" placeholder="City" required>
			</div>

			<label for="email">Email address</label>
			<input type="email" id="email" name="email" required>

			<div class="phone-group">
				<select id="countryCode" name="countryCode">
					<option value="+47">NO (+47)</option>
					<option value="+46">SE (+46)</option>
					<option value="+45">DK (+45)</option>
					<option value="+358">FI (+358)</option>
				</select>
				<input type="tel" id="phone" name="phone" placeholder="Phone number" required>
			</div>

			<label for="password">Password</label>
			<input type="password" id="password" name="password" required>

			<button type="submit" class="btn btn--auth">Register</button>

		</form>


		<p id="message" class="auth-message"></p>
	</main>

	<footer id="footer"></footer>

	<script type="module" src="js/utils/main.js"></script>
	<script type="module" src="js/pages/register.js"></script>

</body>

</html>
