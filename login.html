<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Login | Roast & Leaf</title>
	<meta name="description" content="Discover artisan coffee and tea blends with detailed origins and tasting notes.">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap"
		rel="stylesheet">
	<script src="https://kit.fontawesome.com/a87332500a.js" crossorigin="anonymous"></script>

	<link rel="stylesheet" href="css/styles.css">
	<link rel="icon" href="images/logo.png" type="image/png">
</head>

<body>

	<header id="header"></header>

	<main class="auth-container">
		<h1>Log in</h1>

		<p>Not a member yet? <a href="register.html">Register here.</a></p>

		<form id="loginForm">
			<label for="email">Email address</label>
			<input type="email" id="email" required>

			<label for="password">Password</label>
			<input type="password" id="password" required>

			<button type="submit" class="btn btn--auth">Login</button>

		</form>

		<p id="message" class="auth-message"></p>
	</main>

	<footer id="footer"></footer>

	<script type="module" src="js/utils/main.js"></script>
	<script type="module" src="js/pages/login.js"></script>

</body>
</html>
